<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Brief</title>
  <link rel="stylesheet" href="/assets/css/site-v2.css">
</head>

<body>

<div class="container">

  <h1>📝 Content Brief</h1>

  <nav id="ghostNav"></nav>

  <section class="card">
    <h2>🏆 Winner Reference</h2>
    <div id="winnerReferenceCard">
      <p>Select a recommendation from Results first.</p>
    </div>
  </section>

  <section class="card">
    <h2>🎯 Winning Brief</h2>

    <div class="brief-field">
      <h3>Title</h3>
      <p id="briefTitle">Select a recommendation...</p>
    </div>

    <div class="brief-field">
      <h3>Category</h3>
      <p id="briefCategory">-</p>
    </div>

    <div class="brief-field">
      <h3>Pattern</h3>
      <p id="briefPattern">-</p>
    </div>

    <div class="brief-field">
      <h3>Hook</h3>
      <p id="briefHook">-</p>
    </div>

    <div class="brief-field">
      <h3>Angle</h3>
      <p id="briefAngle">-</p>
    </div>

    <div class="brief-field">
      <h3>Emotion</h3>
      <p id="briefEmotion">-</p>
    </div>

    <div class="brief-field">
      <h3>Goal</h3>
      <p id="briefGoal">-</p>
    </div>

    <div class="brief-field">
      <h3>CTA</h3>
      <p id="briefCTA">-</p>
    </div>
  </section>

  <section class="card ghost-next">
    <h2>➡️ Next Step</h2>
    <p>Turn this brief into fresh content variations.</p>

    <div class="btn-row">
      <button id="sendToFactoryBtn" class="btn">
        ✨ Create Variations →
      </button>

      <a class="btn secondary-btn" href="/dashboard/opportunities.html">
        ← Back To Opportunities
      </a>
    </div>
  </section>

</div>

<script src="/assets/js/ghost-nav.js"></script>
<script src="/assets/js/storage.js"></script>
<script src="/assets/js/briefs.js"></script>

</body>
</html>
