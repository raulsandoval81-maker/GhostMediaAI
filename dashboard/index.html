<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Ghost Media | Headquarters</title>

<link
  rel="stylesheet"
  href="/assets/headquarters/headquarters.css"
/>

</head>

<body>

<div id="gate">

  <!-- Background -->

  <img
    id="gateBackground"
    src="/assets/headquarters/gate-background.png"
    alt=""
  >
<div id="crtFlash"></div>
  <!-- Scanlines -->

  <img
    id="scanlines"
    src="/assets/headquarters/scanlines.png"
    alt=""
  >

  <!-- Ghost Boot -->

  <img
    id="ghostGlitch"
    src="/assets/headquarters/ghost-glitch.png"
    alt=""
  >

  <!-- Final Logo -->

  <img
    id="ghostLockup"
    src="/assets/headquarters/ghost-lockup.png"
    alt=""
  >

  <!-- HUD -->

  <img
    id="statusOverlay"
    src="/assets/headquarters/ghost-status-overlay.png"
    alt=""
  >

  <!-- Dynamic Status -->

  <div id="statusBox">

    <p>HEADQUARTERS STATUS</p>

    <span>Loading Mission...</span>

  </div>

  <!-- Enter -->

  <button id="enterHQ">

    ENTER HEADQUARTERS →

  </button>

</div>
<script src="/assets/headquarters/gateway.js"></script>
</body>

</html>
