<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Ghost Media | Headquarters</title>

<link
  rel="stylesheet"
  href="/assets/gate/gate.css"
/>

</head>

<body>

<div id="gate">

  <!-- Background -->

  <img
    id="gateBackground"
    src="/assets/gate/gate-background.png"
    alt=""
  >
<div id="crtFlash"></div>
  <!-- Scanlines -->

  <img
    id="scanlines"
    src="/assets/gate/scanlines.png"
    alt=""
  >

  <!-- Ghost Boot -->

  <img
    id="ghostGlitch"
    src="/assets/gate/ghost-glitch.png"
    alt=""
  >

  <!-- Final Logo -->

  <img
    id="ghostLockup"
    src="/assets/gate/ghost-lockup.png"
    alt=""
  >

  <!-- HUD -->

  <img
    id="statusOverlay"
    src="/assets/gate/ghost-status-overlay.png"
    alt=""
  >

  <!-- Dynamic Status -->

  <div id="statusBox">

    <p>HEADQUARTERS STATUS</p>

    <span>Loading Mission...</span>

  </div>

  <!-- Enter -->

  <button id="enterHQ">

    ENTER HEADQUARTERS →

  </button>

</div>

<script src="/assets/gate/gate.js"></script>

</body>

</html>
