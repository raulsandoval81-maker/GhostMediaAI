<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Images</title>
<link rel="stylesheet" href="/assets/css/site-v2.css" />
  <link rel="stylesheet" href="/assets/css/image-generator.css" />
</head>

<body>

<main class="wrap">

  <h1>🎨 Create Images</h1>

  <nav id="ghostNav"></nav>

  <p>
    Generate real AI image concepts, then use them for posts, thumbnails, carousels, or campaign art.
  </p>

  <section class="card form-card">

    <h2>Image Brief</h2>

    <div id="imageSourceContext" class="creative-context"></div>

    <label for="title">Title</label>
    <input
      id="title"
      type="text"
      placeholder="Arena Mode Is Finally Playable"
    />

    <label for="prompt">Prompt</label>
    <textarea
      id="prompt"
      placeholder="Describe the image you want GhostMedia to create..."
    ></textarea>

    <label for="product">Product / Category</label>
    <input id="product" type="text" placeholder="Product or category" />

    <label for="topic">Topic</label>
    <input id="topic" type="text" placeholder="Content topic" />

    <label for="style">Style</label>
    <select id="style">
      <option value="sports-documentary">Sports Documentary</option>
      <option value="cinematic-poster">Cinematic Poster</option>
      <option value="youtube-thumbnail">YouTube Thumbnail</option>
      <option value="instagram-carousel">Instagram Carousel</option>
      <option value="editorial">Editorial</option>
      <option value="comic-book">Comic Book</option>
      <option value="retro-game-cover">Retro Game Cover</option>
    </select>

    <label for="ratio">Format</label>
    <select id="ratio">
      <option value="1024x1024">Square</option>
      <option value="1024x1536">Portrait</option>
      <option value="1536x1024">Landscape</option>
    </select>

    <button id="generateBtn" class="btn">
      ✨ Generate 3 Concepts
    </button>

  </section>

  <section class="card">
    <h2>Generated Concepts</h2>
    <p>
      Preview the concepts, then send the strongest one to Review Content.
    </p>

    <div id="preview" class="image-concept-grid">
      <div class="page-card faded">
        <h3>No images yet</h3>
        <p>Create a brief, then generate concepts.</p>
      </div>
    </div>
  </section>

</main>

<script src="/assets/js/storage.js"></script>
<script src="/assets/js/creative.js"></script>
<script src="/assets/js/api-client.js"></script>
<script src="/assets/js/ghost-nav.js"></script>
<script src="/assets/js/image-generator.js"></script>

</body>
</html>
